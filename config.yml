baseURL: https://www.ellemouton.com
languageCode: en-us
title: Elle Mouton 
theme: "PaperMod"
googleAnalytics: "G-PMLX8P6J9S"
comments: true
enableEmoji: true

menu:
  main:
      - name: About
        url: about/
        weight: 0
      - name: CV
        url: CV_Elle_Mouton.pdf
        weight: 1
      - name: Archive
        url: archives
        weight: 5
      - name: Search
        url: search/
        weight: 10

# Needed for search functionality
outputs:
 home:
     - HTML
     - RSS
     - JSON

markup:
  goldmark:
    renderer:
      # Allow inline HTML (e.g. logo <img> tags in headings) in markdown.
      # Safe here because all content is authored by the site owner.
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
            - - $
              - $
        enable: true

params:
  math: true
  comments: true
  defaultTheme: light # auto, dark
  ShowShareButtons: true
  
  homeInfoParams:
        Title: "Layer by Layer"
        Content: |
          Welcome! Here you'll find deep dives into Bitcoin and Lightning Network protocols. New here? Start with the [about page](/about/).

  homeButtons:
      - name: "About me"
        url: "/about/"

  socialIcons:
      - name: github
        url: "https://github.com/ellemouton"
      - name: twitter
        url: "https://twitter.com/ellemouton"
      - name: keybase
        url: "https://keybase.io/ellemo"
      - name: instagram
        url: "https://www.instagram.com/ellemouton"
      - name: linkedin
        url: "https://www.linkedin.com/in/elle-mouton-50635a143/"
      - name: "rss"
        url: "https://www.ellemouton.com/index.xml"

  buttons:
      - name: Archives
        url: archives

  author: Elle Mouton

  ShowFullTextinRSS: true